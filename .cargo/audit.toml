[advisories]
ignore = [
  # Marvin attack on rsa: timing of private-key operations (decryption
  # and signing) can leak the key. hatchrun-cloud uses rsa only to
  # verify GitHub Actions tokens against GitHub's public keys; only its
  # tests sign, with keys made for the test. Revisit if anything here
  # starts signing or decrypting with rsa.
  "RUSTSEC-2023-0071",
]
