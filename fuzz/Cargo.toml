[package]
name = "hatchrun-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.hatchrun-workflow]
path = "../crates/workflow"

# Keep line numbers in crashes and reproduce them locally.
[profile.release]
debug = 1

# The fuzzers are their own workspace, so the root workspace does not
# build them with the stable toolchain.
[workspace]
members = ["."]

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "convert"
path = "fuzz_targets/convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expr"
path = "fuzz_targets/expr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cron"
path = "fuzz_targets/cron.rs"
test = false
doc = false
bench = false
