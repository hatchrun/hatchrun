name = "hatchrun-broker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# Runners claim their config here. The agent only talks to an HTTPS
# broker, which the custom domain gives it.
routes = [
  { pattern = "broker.hatchrun.io", custom_domain = true },
]

[build]
command = "cargo install --locked worker-build --version 0.8.7 && worker-build --release"

[[durable_objects.bindings]]
name = "TICKETS"
class_name = "Ticket"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ticket"]
