[package]
name = "hatchrun-ci"
version = "0.1.0"
description = "Cloudflare Worker behind ci.hatchrun.io: workflow runs on fresh instances"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
async-lock = "3.4.1"
base64 = "0.23.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
hatchrun-cloud = { path = "../cloud", default-features = false }
hatchrun-workflow = { path = "../workflow" }
hmac = "0.13.0"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio-postgres = { version = "0.7.15", default-features = false }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
worker = { version = "0.8.7", features = ["queue", "tokio-postgres"] }

# The Worker reaches Postgres through a Hyperdrive socket; getrandom
# needs the browser's crypto there for SCRAM.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { version = "0.7.15", default-features = false, features = ["js"] }

# Tests run the store's queries against a real Postgres over TCP.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hatchrun-cloud = { path = "../cloud", default-features = false, features = ["testdb"] }
tokio = { version = "1.48.0", features = ["rt", "net", "time", "io-util", "sync"] }
tokio-postgres = { version = "0.7.15", features = ["runtime"] }

[lints]
workspace = true
