name = "hatchrun-ci"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# The webhook forwarded by hatchrun-cloud, the runner agent's API, the
# app's CI API and the logs all live on ci.hatchrun.io. token.ci.hatchrun.io
# is the issuer of the OIDC tokens jobs with id-token: write get; the
# Worker serves its discovery document and JWKS there.
routes = [
  { pattern = "ci.hatchrun.io", custom_domain = true },
  { pattern = "token.ci.hatchrun.io", custom_domain = true },
]

[build]
command = "cargo install --locked worker-build --version 0.8.7 && worker-build --release"

# The reconciler every minute: stuck jobs, schedules and expiry.
[triggers]
crons = ["* * * * *"]

# The same Postgres as hatchrun-cloud, through Hyperdrive; the ci_
# tables are in crates/cloud/migrations/0004_ci.sql. wrangler dev
# connects to localConnectionString instead.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f52a1b8002e845c695362157863436fb"
localConnectionString = "postgres://postgres:postgres@localhost:5432/postgres"

# Installation tokens, shared with hatchrun-cloud.
[[kv_namespaces]]
binding = "TOKENS"
id = "92b81a8052544d3387c16535ee2a4fa2"

# One RunObject per run, which orders the run's job events and log
# batches.
[[durable_objects.bindings]]
name = "RUNS"
class_name = "RunObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunObject"]

# Finished logs, kept for the tenant's retention (30 days, 90 for
# enterprise tenants):
# logs/<days>d/<tenant>/<repo_id>/<run>/<job>/<attempt>.log.gz and its
# .index.json, and state/<days>d/<tenant>/<run>.json.
# Created by hand once; deploy-ci.yml applies r2-lifecycle.json, which
# has one rule per tier and prefix.
[[r2_buckets]]
binding = "LOGS"
bucket_name = "hatchrun-ci-logs"

# Launches. The webhook and the reconciler send each job that is ready
# here and this Worker's consumer starts its instance.
[[queues.producers]]
binding = "CI_LAUNCHES"
queue = "hatchrun-ci-launches"

# Small batches, sent after a second at most, so a job's start does not
# wait for other jobs. Messages that fail max_retries times go to the
# dead-letter queue, whose consumer fails their jobs.
[[queues.consumers]]
queue = "hatchrun-ci-launches"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 3
max_concurrency = 10
dead_letter_queue = "hatchrun-ci-launches-dlq"

# Launch messages that ran out of retries. This Worker records each one
# in ci_failed_launches and emails the failed launch alert
# (crates/ci/src/alerts); the reconciler launches the job again.
[[queues.consumers]]
queue = "hatchrun-ci-launches-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Alert emails, sent through Cloudflare Email Service from
# alerts@notify.hatchrun.io, a subdomain onboarded to Email Sending so
# hatchrun.io's own mail records stay as they are. The binding sends
# from that address only. The inbox is the ALERT_EMAIL secret, kept out
# of this public file.
[[send_email]]
name = "ALERTS"
allowed_sender_addresses = ["alerts@notify.hatchrun.io"]

# The key that seals CI secrets, from the account's Secrets Store;
# e2e.sh points store_id at a local store. secret_name is a secret in
# that store with scope workers, holding base64 of 32 random bytes
# (`openssl rand -base64 32`). To rotate: add the new secret to the
# store, point CI_SECRETS_KEY at it with a new CI_SECRETS_KEY_ID, move
# the old one to CI_SECRETS_KEY_OLD and CI_SECRETS_KEY_OLD_ID, deploy,
# and drop the old binding once no ci_secrets row has the old key_id.
[[secrets_store_secrets]]
binding = "CI_SECRETS_KEY"
store_id = "05338d0fc1d04ad6853ad8b9874b3fc4"
secret_name = "ci-secrets-key-2026-10"

# Secrets: GITHUB_WEBHOOK_SECRET, GITHUB_APP_PRIVATE_KEY,
# OIDC_SIGNING_KEY (signs the token for AssumeRoleWithWebIdentity),
# CI_OIDC_SIGNING_KEY (RSA private key in PEM, signs the OIDC tokens of
# jobs; a key of its own, never OIDC_SIGNING_KEY, which customer AWS
# accounts trust for the control plane; generate with
# `openssl genrsa 2048`, the PEM must be PKCS#8: add `| openssl pkcs8
# -topk8 -nocrypt`),
# BROKER_TOKEN (shared with hatchrun-broker), CI_TOKEN_KEY (the HMAC
# key of job tokens), POLAR_ACCESS_TOKEN (the usage events only; the
# same token hatchrun-cloud holds) and ALERT_EMAIL (the inbox alerts go
# to), uploaded by deploy-ci.yml, and CI_ROLE_ARN, set once on the
# Worker by hand: the RoleArn output of
# deploy/cloudformation/ci-account.yaml, the role the Worker assumes in
# the CI AWS account. The Worker finds the
# launch template and subnets there by name and tag.
# Variables: those below.
[vars]
# production, staging or dev. The local launcher backend is refused in
# production.
DEPLOY_ENV = "production"
# How instances start: ec2.
LAUNCHER = "ec2"
# The app's origin, for links in check runs.
APP_URL = "https://app.hatchrun.io"
# This Worker's origin, which runner agents call.
CI_URL = "https://ci.hatchrun.io"
# hatchrun-broker, shared with hatchrun-cloud.
BROKER_URL = "https://broker.hatchrun.io"
# Client id of the hatchrun GitHub App (github.com/apps/hatchrun).
GITHUB_APP_ID = "Iv23liMh4C066YyxQB7R"
# kid of OIDC_SIGNING_KEY in oidc.hatchrun.io's JWKS.
OIDC_KEY_ID = "2026-10-14"
# kid of CI_OIDC_SIGNING_KEY in token.ci.hatchrun.io's JWKS. The JWKS
# also lists CI_OIDC_NEXT_SIGNING_KEY and CI_OIDC_PREVIOUS_SIGNING_KEY
# while CI_OIDC_NEXT_KEY_ID and CI_OIDC_PREVIOUS_KEY_ID are set here:
# publish the next key, wait an hour for caches, then move it to
# CI_OIDC_SIGNING_KEY with a new CI_OIDC_KEY_ID.
CI_OIDC_KEY_ID = "2026-11-03"
# The region of the CI AWS account, where jobs run.
CI_REGION = "us-east-1"
# The S3 bucket of job artifacts: the ArtifactsBucket output of
# deploy/cloudformation/ci-account.yaml. A bucket name is an id, not a
# secret, and is committed here like the other ids in this file. The
# agent gets the artifact service and the job cache, which keeps its
# entries under cache/, only once it is set.
ARTIFACTS_BUCKET = "hatchrun-ci-artifactsbucket-flrtihmpyo4z"
# POLAR_API_URL is left unset, so the usage events go to
# https://api.polar.sh, the same Polar as hatchrun-cloud.
# The id of the key behind CI_SECRETS_KEY, stored with every sealed
# value, and of the one behind CI_SECRETS_KEY_OLD (empty when none).
CI_SECRETS_KEY_ID = "2026-10"
CI_SECRETS_KEY_OLD_ID = ""
