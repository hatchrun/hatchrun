# The repository crates/ci/scripts/e2e.sh pushes to. Each branch starts
# one workflow, except bad: main the passing pair, fail a failing job,
# slow a job the script cancels, arm a job on the arm64 template that
# echoes a secret, bad a workflow with a runs-on that names no template
# and one that runs, and wide six jobs at once, one more than the cap.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: say hello
        run: |
          echo "hello from e2e"
          echo "::error file=README.md,line=1::e2e annotation"
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "build said ${{ needs.build.result }}"
  broken:
    runs-on: ubuntu-latest
    steps:
      - name: fail on purpose
        run: |
          echo "about to fail"
          exit 3
  sleeper:
    runs-on: ubuntu-latest
    steps:
      - name: wait for the cancel
        run: |
          echo "waiting"
          sleep 300
  arm-hello:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: say the secret
        run: echo "secret is ${{ secrets.E2E_SECRET }}"
  old-label:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "never runs"
  bad-ok-hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "the other workflow ran"
  nap:
    runs-on: ubuntu-latest
    steps:
      - name: nap
        run: sleep 20
workflows:
  ci:
    on: { push: { branches: [main] } }
    jobs:
      - build
      - test: { requires: [build] }
  failing:
    on: { push: { branches: [fail] } }
    jobs:
      - broken
  slow:
    on: { push: { branches: [slow] } }
    jobs:
      - sleeper
  arm:
    on: { push: { branches: [arm] } }
    jobs:
      - arm-hello
  bad:
    on: { push: { branches: [bad] } }
    jobs:
      - old-label
  bad-ok:
    on: { push: { branches: [bad] } }
    jobs:
      - bad-ok-hello
  wide:
    on: { push: { branches: [wide] } }
    jobs:
      - nap: { matrix: { n: [1, 2, 3, 4, 5, 6] } }
