# The repository crates/ci/scripts/e2e.sh pushes to. Each branch starts
# one workflow, except bad: main the passing pair, fail a failing job,
# slow a job the script cancels, arm a job on the arm64 template that
# echoes a secret, bad a workflow with a runs-on that names no template
# and one that runs, wide six jobs at once, one more than the cap,
# serial a matrix of failing legs that run one at a time, soft a failing
# job that continue-on-error counts as a success, guard a job whose
# environment allows other branches, deploy two jobs on an environment
# that needs approval, oidc one job with id-token: write that asks for a
# token and one without it, queue a workflow that shares a concurrency
# group between its runs, and replace one whose group cancels the run in
# progress.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: say hello
        run: |
          echo "hello from e2e"
          echo "::error file=README.md,line=1::e2e annotation"
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "build said ${{ needs.build.result }}"
  broken:
    runs-on: ubuntu-latest
    steps:
      - name: fail on purpose
        run: |
          echo "about to fail"
          exit 3
  sleeper:
    runs-on: ubuntu-latest
    steps:
      - name: wait for the cancel
        run: |
          echo "waiting"
          sleep 300
  arm-hello:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: say the secret
        run: echo "secret is ${{ secrets.E2E_SECRET }}"
  old-label:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "never runs"
  bad-ok-hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "the other workflow ran"
  nap:
    runs-on: ubuntu-latest
    steps:
      - name: nap
        run: sleep 20
  leg:
    runs-on: ubuntu-latest
    steps:
      - name: fail after a while
        run: |
          echo "leg ${{ matrix.n }}"
          sleep 10
          exit 1
  lenient:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.soft }}
    steps:
      - run: |
          echo "about to fail softly"
          exit 1
  after-lenient:
    runs-on: ubuntu-latest
    steps:
      - run: echo "lenient said ${{ needs.lenient.result }}"
  guarded:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "never runs"
  deploy-a:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: show the values
        run: |
          printf '%s' "${{ secrets.ENV_SECRET }}" | openssl dgst -sha256 -r | cut -d' ' -f1
          echo "var is ${{ vars.ENV_VAR }}"
          echo "org only is [${{ secrets.ORG_ONLY }}]"
  deploy-b:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "never runs"
  mint:
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    steps:
      - name: ask for a token
        run: |
          answer="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.e2e.example")"
          jwt="$(printf '%s' "$answer" | sed 's/.*"value":"\([^"]*\)".*/\1/')"
          payload="$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')"
          case $((${#payload} % 4)) in 2) payload="$payload==";; 3) payload="$payload=";; esac
          printf '%s' "$payload" | base64 -d | tr ',' '\n'
          echo
          echo "parts=$(printf '%s' "$jwt" | tr '.' '\n' | wc -l)"
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: look for the request
        run: echo "request=[${ACTIONS_ID_TOKEN_REQUEST_URL-unset}]"
  sit:
    runs-on: ubuntu-latest
    steps:
      - name: wait for the cancel
        run: |
          echo "sitting"
          sleep 300
workflows:
  ci:
    on: { push: { branches: [main] } }
    jobs:
      - build
      - test: { requires: [build] }
  failing:
    on: { push: { branches: [fail] } }
    jobs:
      - broken
  slow:
    on: { push: { branches: [slow] } }
    jobs:
      - sleeper
  arm:
    on: { push: { branches: [arm] } }
    jobs:
      - arm-hello
  bad:
    on: { push: { branches: [bad] } }
    jobs:
      - old-label
  bad-ok:
    on: { push: { branches: [bad] } }
    jobs:
      - bad-ok-hello
  wide:
    on: { push: { branches: [wide] } }
    jobs:
      - nap: { matrix: { n: [1, 2, 3, 4, 5, 6] } }
  serial:
    on: { push: { branches: [serial] } }
    jobs:
      - leg: { name: serial, matrix: { n: [1, 2, 3] }, strategy: { max-parallel: 1 } }
  soft:
    on: { push: { branches: [soft] } }
    jobs:
      - lenient: { matrix: { soft: [true] } }
      - after-lenient: { requires: [lenient] }
  guard:
    on: { push: { branches: [guard] } }
    jobs:
      - guarded
  deploy:
    on: { push: { branches: [deploy] } }
    jobs:
      - deploy-a
      - deploy-b
  oidc:
    on: { push: { branches: [oidc] } }
    jobs:
      - mint
      - plain
  queue:
    on: { push: { branches: [queue] } }
    concurrency: e2e-${{ github.workflow }}
    jobs:
      - sit
  replace:
    on: { push: { branches: [replace] } }
    concurrency:
      group: e2e-${{ github.workflow }}
      cancel-in-progress: true
    jobs:
      - sit
