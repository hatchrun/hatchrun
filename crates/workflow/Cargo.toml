[package]
name = "hatchrun-workflow"
version = "0.1.0"
description = "Parses, validates and plans hatchrun workflow files"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "workflow"
harness = false

[lints]
workspace = true
