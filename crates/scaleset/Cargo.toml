[package]
name = "hatchrun-scaleset"
version = "0.1.0"
description = "Sans-IO client for the GitHub Actions runner scale set API"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[lints]
workspace = true
