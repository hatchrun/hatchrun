[package]
name = "hatchrun-agent"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
humantime = "2.4.0"
nix = { version = "0.31.3", features = ["user", "process", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "process", "signal", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "process", "signal", "io-util", "test-util"] }
wiremock = "0.6.5"
