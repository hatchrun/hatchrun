name: web

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "!web/**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm ci && npm run build
        working-directory: web
