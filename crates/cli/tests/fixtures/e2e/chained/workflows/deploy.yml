name: Deploy

on:
  workflow_run:
    workflows: [CI, Lint]
    types: [completed, requested]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: ./deploy.sh "${{ hatchrun.ref_name }}"
