name: Publish

on:
  release:
    types: [published, edited]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Upload the assets for ${{ github.ref_name }}
        run: gh release upload "${{ hatchrun.ref_name }}" dist/*
      - name: Check out the docs
        uses: actions/checkout@v5
        with:
          repository: acme/docs
          path: docs
