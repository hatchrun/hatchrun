name: CI

on:
  push:
    branches: [main]
  issue_comment:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - run: cargo test
