name: notify

on:
  workflow_call:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - run: ./scripts/alert.sh
  tidy:
    needs: alert
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: ./scripts/tidy.sh
