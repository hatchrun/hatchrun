name: build

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm ci && npm run build -- --target ${{ inputs.target }}
