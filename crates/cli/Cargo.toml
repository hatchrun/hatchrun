[package]
name = "hatchrun-cli"
version = "0.1.0"
description = "The hatchrun command line: validate and convert workflow files"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "hatchrun"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
hatchrun-workflow = { path = "../workflow" }

[lints]
workspace = true
