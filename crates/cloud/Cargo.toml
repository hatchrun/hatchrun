[package]
name = "hatchrun-cloud"
version = "0.1.0"
description = "Cloudflare Worker behind hatchrun.io: GitHub App webhooks in, runner instances out"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
aws-credential-types = { version = "1.3.0", default-features = false }
aws-sigv4 = { version = "1.6.0", default-features = false, features = ["sign-http", "http1"] }
base64 = "0.23.1"
hmac = "0.13.0"
js-sys = "0.3.106"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }
worker = { version = "0.8.7", features = ["d1"] }

[lints]
workspace = true
