[package]
name = "hatchrun-cloud"
version = "0.1.0"
description = "Cloudflare Worker behind hatchrun.io: GitHub App webhooks in, runner instances out"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
aws-credential-types = { version = "1.3.0", default-features = false }
aws-sigv4 = { version = "1.6.0", default-features = false, features = ["sign-http", "http1"] }
base64 = "0.23.1"
bytes = "1.11.0"
ed25519-dalek = { version = "3.0.0", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
hmac = "0.13.0"
js-sys = "0.3.106"
roxmltree = "0.21.1"
rsa = { version = "0.9.10", default-features = false, features = ["u64_digit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }
tokio-postgres = { version = "0.7.15", default-features = false }
worker = { version = "0.8.7", features = ["queue", "tokio-postgres"] }

# The Worker reaches Postgres through a Hyperdrive socket; getrandom
# needs the browser's crypto there for SCRAM.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { version = "0.7.15", default-features = false, features = ["js"] }

# Tests run the Worker's queries against a real Postgres over TCP.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.48.0", features = ["rt", "net"] }
tokio-postgres = { version = "0.7.15", features = ["runtime"] }

[lints]
workspace = true
