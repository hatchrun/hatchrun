name = "hatchrun-cloud"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
# The hatchrun Cloudflare account. Naming it here keeps wrangler, run
# by hand or in CI, from deploying or setting secrets in another
# account the same login can reach.
account_id = "20438923120e30641ae734882be1937a"

# The webhook shares hatchrun.io with the website, which serves every
# other path; the OIDC issuer gets its own hostname.
routes = [
  { pattern = "hatchrun.io/github/*", zone_name = "hatchrun.io" },
  { pattern = "oidc.hatchrun.io", custom_domain = true },
]

[build]
command = "cargo install --locked worker-build --version 0.8.7 && worker-build --release"

# wrangler dev uses a local database. The deploy workflow sets
# database_id from the CLOUDFLARE_D1_DATABASE_ID secret.
[[d1_databases]]
binding = "DB"
database_name = "hatchrun-cloud"
database_id = "local"
migrations_dir = "migrations"

# Secrets: GITHUB_WEBHOOK_SECRET, GITHUB_APP_PRIVATE_KEY (PEM),
# OIDC_SIGNING_KEY (RSA private key in PEM) and BROKER_TOKEN.
# Variables: GITHUB_APP_ID below, OIDC_KEY_ID (the signing key's kid)
# and BROKER_URL. GITHUB_API_URL and AWS_ENDPOINT_URL point the Worker
# at local stubs under wrangler dev.
[vars]
# Client id of the hatchrun GitHub App (github.com/apps/hatchrun).
GITHUB_APP_ID = "Iv23liMh4C066YyxQB7R"
