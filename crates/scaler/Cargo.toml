[package]
name = "hatchrun-scaler"
version = "0.1.0"
description = "Launches an EC2 instance for every GitHub Actions job of a runner scale set"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "sso"] }
aws-lc-rs = "1.18.1"
aws-sdk-ec2 = { version = "1.265.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hatchrun-scaler-core = { path = "../scaler-core" }
hatchrun-scaleset = { path = "../scaleset" }
http = "1.5.0"
humantime = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "signal", "test-util"] }

[lints]
workspace = true
