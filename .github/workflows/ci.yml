name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # hatchrun-cloud's tests run its queries against Postgres, the
    # version PlanetScale runs; each test gets a schema of its own.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The scale set client and scaler core must stay free of I/O so they
      # run in Workers, next to the broker.
      - run: cargo check --locked -p hatchrun-scaleset -p hatchrun-scaler-core -p hatchrun-broker -p hatchrun-cloud -p hatchrun-telemetry --target wasm32-unknown-unknown
      # The CI Worker reuses hatchrun-cloud without its entry points.
      - run: cargo check --locked -p hatchrun-cloud -p hatchrun-ci --no-default-features --target wasm32-unknown-unknown
      # The workflow format crate also runs in the Worker.
      - run: cargo build --locked -p hatchrun-workflow --target wasm32-unknown-unknown

  # Owners get the update offer only for stacks older than
  # TEMPLATE_VERSION, so a change to connect.yaml that keeps the version
  # would reach new stacks and never the existing ones. Full-line
  # comments are ignored: CloudFormation never sees them, and a header
  # change should not offer every owner a stack update.
  template-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # HEAD is the merge commit; its first parent is the base branch.
      - run: |
          template() {
            grep -v '^[[:space:]]*#' || true
          }
          if cmp -s \
            <(git show HEAD^1:deploy/cloudformation/connect.yaml | template) \
            <(template < deploy/cloudformation/connect.yaml); then
            exit 0
          fi
          version() {
            grep -oP '^\s*(pub(\([^)]*\))?\s+)?const\s+TEMPLATE_VERSION\s*:\s*u[0-9]+\s*=\s*\K[0-9]+' || true
          }
          old=$(git show HEAD^1:crates/cloud/src/connect.rs | version)
          new=$(version < crates/cloud/src/connect.rs)
          if [ -z "${old}" ] || [ -z "${new}" ]; then
            echo "::error file=crates/cloud/src/connect.rs::Cannot read TEMPLATE_VERSION (base: '${old}', this branch: '${new}')."
            exit 1
          fi
          if [ "${new}" -le "${old}" ]; then
            echo "::error file=deploy/cloudformation/connect.yaml::connect.yaml changed but TEMPLATE_VERSION is still ${new}. Bump it in crates/cloud/src/connect.rs and add a CHANGES entry."
            exit 1
          fi

  # The app in web/app, which hatchrun-cloud serves on app.hatchrun.io.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  # Tests that switch users need root and a real account.
  root-tests:
    runs-on: ubuntu-latest
    container:
      image: rust:1.99@sha256:6ff07edce8775d0f64be7aba9197229407301bddf2054d62c27b541a6238a181
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          groupadd hatchrun-extra
          useradd --create-home --groups hatchrun-extra hatchrun-test
      - run: cargo test --locked -- --ignored

  # Every file must carry a licence and copyright (https://reuse.software).
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==6.2.0 lint

  # Secrets and account IDs anywhere in the history of the checked-out
  # commit, with the rules in .gitleaks.toml. gitleaks-action needs a
  # licence key secret for organizations, which fork pull requests
  # cannot read, so this runs the release binary.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
      # HEAD only: other branches are checked when their own PRs run.
      - run: '"${RUNNER_TEMP}/gitleaks" git --redact --config .gitleaks.toml --log-opts=HEAD'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit

  systemd-unit:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          apt-get update -qq
          apt-get install -y -qq systemd
          install -m 0755 /bin/true /usr/bin/hatchrun-agent
          systemd-analyze verify packaging/systemd/hatchrun-agent.service packaging/systemd/hatchrun-launch.service
