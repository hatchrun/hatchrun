name: deploy-cloud

# Deploys crates/cloud, the Worker behind hatchrun.io, and the app in
# web/app, which the Worker serves on app.hatchrun.io, from main. The
# API token can edit Workers and D1 in the hatchrun account only, and
# only this job, on main, in the protected production environment, can
# read it. The account comes from the CLOUDFLARE_ACCOUNT_ID secret.

on:
  push:
    branches: [main]
    paths:
      - crates/cloud/**
      - web/app/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/deploy-cloud.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WRANGLER: wrangler@4.145.0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # worker-build is installed by the build command in wrangler.toml;
      # caching it saves compiling it on every deploy. cargo install needs
      # its own record of the install too, or it refuses to overwrite the
      # binary it finds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deploy-cloud-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # wrangler.toml points the Worker's static assets at web/app/dist.
      - name: Build the app
        working-directory: web/app
        run: |
          npm ci
          npm run build

      - name: Point at the production database
        env:
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$DATABASE_ID"
          sed -i "s/^database_id = \"local\"$/database_id = \"${DATABASE_ID}\"/" wrangler.toml
          grep -qx "database_id = \"${DATABASE_ID}\"" wrangler.toml

      - name: Point at the production token namespace
        env:
          NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_TOKENS_ID }}
        run: |
          test -n "$NAMESPACE_ID"
          sed -i "s/^id = \"local\"$/id = \"${NAMESPACE_ID}\"/" wrangler.toml
          grep -qx "id = \"${NAMESPACE_ID}\"" wrangler.toml

      # Migrations only add tables and columns, so the running Worker
      # keeps working against the new schema until the deploy lands.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" d1 migrations apply hatchrun-cloud --remote

      # Secrets set in the environment are uploaded with the deploy;
      # those left empty keep their current value on the Worker. GitHub
      # refuses secret names that start with GITHUB_, so the App's are
      # stored as APP_* and uploaded under the Worker's names.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.APP_WEBHOOK_SECRET }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_CLIENT_SECRET }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          OIDC_SIGNING_KEY: ${{ secrets.OIDC_SIGNING_KEY }}
          OIDC_NEXT_SIGNING_KEY: ${{ secrets.OIDC_NEXT_SIGNING_KEY }}
          OIDC_PREVIOUS_SIGNING_KEY: ${{ secrets.OIDC_PREVIOUS_SIGNING_KEY }}
          BROKER_TOKEN: ${{ secrets.BROKER_TOKEN }}
          TELEMETRY_SIGNING_KEY: ${{ secrets.TELEMETRY_SIGNING_KEY }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          (umask 077 && jq -n 'env | with_entries(select(
              (.key | IN("GITHUB_WEBHOOK_SECRET", "GITHUB_APP_PRIVATE_KEY", "GITHUB_CLIENT_SECRET",
                         "POLAR_ACCESS_TOKEN", "POLAR_WEBHOOK_SECRET", "BROKER_TOKEN",
                         "TELEMETRY_SIGNING_KEY",
                         "OIDC_SIGNING_KEY", "OIDC_NEXT_SIGNING_KEY", "OIDC_PREVIOUS_SIGNING_KEY"))
              and .value != ""))' > "$secrets")
          echo "Uploading secrets: $(jq -r 'keys | join(", ")' "$secrets")"
          npx --yes "$WRANGLER" deploy --secrets-file "$secrets"
