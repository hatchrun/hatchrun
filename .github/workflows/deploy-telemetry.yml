name: deploy-telemetry

# Deploys crates/telemetry, the Worker at telemetry.hatchrun.io that
# takes runner metrics into Analytics Engine. It needs no secrets: the
# token public keys come from the TELEMETRY_PUBLIC_KEYS variable of the
# production environment. The account comes from the
# CLOUDFLARE_ACCOUNT_ID secret.

on:
  push:
    branches: [main]
    paths:
      - crates/telemetry/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/deploy-telemetry.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-telemetry
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WRANGLER: wrangler@4.143.0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/telemetry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # worker-build is installed by the build command in wrangler.toml;
      # caching it saves compiling it on every deploy. cargo install needs
      # its own record of the install too, or it refuses to overwrite the
      # binary it finds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deploy-telemetry-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_KEYS: ${{ vars.TELEMETRY_PUBLIC_KEYS }}
        run: |
          test -n "$PUBLIC_KEYS"
          npx --yes "$WRANGLER" deploy --var "TELEMETRY_PUBLIC_KEYS:${PUBLIC_KEYS}"
