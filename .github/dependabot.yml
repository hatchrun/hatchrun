version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /packaging/scaler
    schedule:
      interval: weekly
  # The app in web/app. Releases younger than two weeks wait.
  - package-ecosystem: npm
    directory: /web/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
