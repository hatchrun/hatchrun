version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  # The app in web/app. Releases younger than two weeks wait.
  - package-ecosystem: npm
    directory: /web/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
    # typescript-eslint 8 takes typescript below 6.1, so typescript 7
    # breaks npm ci. Drop this once typescript-eslint supports 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
