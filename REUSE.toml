# Licensing for files that cannot carry a comment header (Cargo.lock,
# NOTICE) and for documentation and GitHub configuration. Source files
# carry their own SPDX header; `reuse lint` in CI checks every file.
version = 1

[[annotations]]
path = [
  "**/*.md",
  ".github/**",
  ".gitignore",
  "Cargo.lock",
  "NOTICE",
]
SPDX-FileCopyrightText = "Copyright 2026 Gamunu Balagalla <gamunu.balagalla@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
