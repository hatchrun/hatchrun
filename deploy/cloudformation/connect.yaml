AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Connects this AWS account and region to hatchrun.io, which runs
  GitHub Actions jobs here on EC2 instances, one instance per job.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: hatchrun.io }
        Parameters:
          - TenantId
          - OidcProviderArn
      - Label: { default: Limits }
        Parameters:
          - InstanceTypes
          - ExcludedInstanceTypes
          - VolumeSizeLimit
      - Label: { default: Runners }
        Parameters:
          - RootVolumeSize
          - CacheRetentionDays
      - Label: { default: Network }
        Parameters:
          - VpcId
          - SubnetIds
    ParameterLabels:
      TenantId: { default: Tenant ID from the hatchrun.io dashboard }
      OidcProviderArn: { default: Existing hatchrun.io OIDC provider }
      InstanceTypes: { default: Allowed instance types }
      ExcludedInstanceTypes: { default: Refused instance types }
      VolumeSizeLimit: { default: Largest runner volume (GiB) }
      CacheRetentionDays: { default: Days to keep cache entries }

Parameters:
  TenantId:
    Type: String
    AllowedPattern: ^[a-z0-9]{8,64}$
    Description: Only hatchrun.io requests for this tenant can use the role this stack creates.
  OidcProviderArn:
    Type: String
    Default: ""
    AllowedPattern: ^(arn:aws[a-z-]*:iam::[0-9]{12}:oidc-provider/oidc\.hatchrun\.io)?$
    Description: >-
      IAM holds one OIDC provider per URL in an account. Leave empty for the
      first stack in the account; for a stack in another region, paste the
      OidcProviderArn output of the first one.
  # The default caps the size at 8xlarge (32 vCPUs for most families)
  # instead of naming families, so types AWS adds later work without
  # updating the stack.
  InstanceTypes:
    Type: CommaDelimitedList
    Default: "*.medium,*.large,*.xlarge,*.2xlarge,*.4xlarge,*.8xlarge"
    Description: >-
      Instance types jobs may ask for, wildcards allowed, at most 256
      characters in all. AWS refuses any other type, whatever a workflow
      asks for, and the app offers only these.
  ExcludedInstanceTypes:
    Type: CommaDelimitedList
    Default: "p*,g*,inf*,trn*,dl*,f*,vt*,mac*,*.metal*"
    Description: >-
      Instance types AWS refuses even when InstanceTypes allows them,
      wildcards allowed, at most 256 characters in all. The default
      refuses GPU, accelerator and bare metal types.
  VolumeSizeLimit:
    Type: Number
    Default: 200
    MinValue: 10
    MaxValue: 16384
    Description: AWS refuses runner volumes, root or cache, larger than this, in GiB.
  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 16384
    Description: Root volume size in GiB for jobs that do not ask for one.
  CacheRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: S3 deletes a cache entry this many days after it was saved.
  VpcId:
    Type: String
    Default: ""
    Description: Existing VPC for runners. Empty creates a VPC with two public subnets and no NAT gateway.
  SubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Subnets in VpcId, tried in order. They need a route to the internet and public IPs, or a NAT gateway.

Conditions:
  CreateVpc: !Equals [!Ref VpcId, ""]
  CreateOidcProvider: !Equals [!Ref OidcProviderArn, ""]

Rules:
  ExistingVpcNeedsSubnets:
    RuleCondition: !Not [!Equals [!Ref VpcId, ""]]
    Assertions:
      - Assert: !Not [!EachMemberEquals [!Ref SubnetIds, ""]]
        AssertDescription: Pick the subnets for runners in the VPC.

Resources:
  # hatchrun.io signs a short-lived token naming the tenant and trades
  # it for this role's credentials with AssumeRoleWithWebIdentity. No
  # access keys exist, and a token for another tenant gets nothing.
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://oidc.hatchrun.io
      ClientIdList: [sts.amazonaws.com]

  # Network, when no VPC is given: public subnets in two zones. Runners
  # need outbound internet access; a NAT gateway would cost about $32 a
  # month, so they get public addresses and a security group that allows
  # no inbound traffic.
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: 10.88.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: hatchrun }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
        - { Key: Name, Value: hatchrun }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: hatchrun }

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.88.0.0/18
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: hatchrun-a }

  SubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.88.64.0/18
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: hatchrun-b }

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "hatchrun runners: no inbound traffic"
      VpcId: !If [CreateVpc, !Ref Vpc, !Ref VpcId]
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: Jobs reach GitHub and whatever they use }
      Tags:
        - { Key: Name, Value: hatchrun-runners }

  # The image and instance type come with each launch, from the job's
  # labels. Runners get no instance profile unless the owner picks one
  # (PassRunnerRoles below): the agent claims its runner config from the
  # hatchrun.io broker with a one-time ticket in user data, and jobs
  # that need AWS use GitHub's OIDC.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - { Key: "hatchrun:tenant", Value: !Ref TenantId }
      LaunchTemplateData:
        SecurityGroupIds: [!Ref RunnerSecurityGroup]
        InstanceInitiatedShutdownBehavior: terminate
        # IMDSv2 only, and a hop limit of 1 so job containers cannot reach
        # the metadata service.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          InstanceMetadataTags: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref RootVolumeSize
              Encrypted: true
              DeleteOnTermination: true

  # What hatchrun.io reads through the role: this template, the subnets
  # runners launch into and the limits above, so the app offers only
  # runners the role can launch. A parameter because CloudFormation
  # rewrites it on every stack update, while the tags of a launch
  # template keep the values the stack was created with. "version" is
  # bumped with crates/cloud/src/connect.rs TEMPLATE_VERSION on every
  # change to this template, so the app can tell owners of older stacks
  # to update.
  StackSettings:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /hatchrun/connect/${TenantId}
      Type: String
      Description: What the hatchrun connect stack allows; hatchrun.io reads it through the role.
      Value: !Sub
        - '{"version":5,"launchTemplateId":"${LaunchTemplate}","subnets":"${Subnets}","instanceTypes":"${Types}","excludedInstanceTypes":"${Excluded}","volumeSizeLimit":${VolumeSizeLimit},"rootVolumeSize":${RootVolumeSize},"fleet":true,"cacheBucket":"${CacheBucket}"}'
        - Subnets: !If
            - CreateVpc
            - !Join [",", [!Ref SubnetA, !Ref SubnetB]]
            - !Join [",", !Ref SubnetIds]
          Types: !Join [",", !Ref InstanceTypes]
          Excluded: !Join [",", !Ref ExcludedInstanceTypes]

  # Job caches, in this account and region so restores cost no data
  # transfer. hatchrun.io signs short-lived URLs for one repository's
  # keys at a time; runners get no credentials for the bucket. The
  # bucket outlives the stack: delete it by hand after removing the
  # stack, or let the lifecycle rule empty it first.
  CacheBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-cache
            Status: Enabled
            ExpirationInDays: !Ref CacheRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: "hatchrun:tenant", Value: !Ref TenantId }

  CacheBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CacheBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CacheBucket.Arn
              - !Sub "${CacheBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # What hatchrun.io may do here: launch AWS Marketplace images from this
  # stack's launch template into this VPC, within the instance type and
  # volume limits above, and stop, start, retag or terminate only the
  # instances it launched. The conditions keep the launch template's
  # metadata and encryption settings from being overridden at launch.
  ControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      Description: hatchrun.io launches and removes runner instances
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref OidcProvider, !Ref OidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.hatchrun.io:aud: sts.amazonaws.com
                oidc.hatchrun.io:sub: !Sub "tenant:${TenantId}"
      Policies:
        - PolicyName: run-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Describing the subnets lets the hatchrun.io app check the
              # stack before saving it; the instance types, their
              # offerings and Spot prices fill its daily catalog of what
              # the region offers. The rest find the security groups and
              # capacity reservations tagged for hatchrun, cache volumes
              # and snapshots, and launch template versions a launch
              # failed to delete. EC2 allows describing only on "*".
              - Sid: List
                Effect: Allow
                Action:
                  - ec2:DescribeCapacityReservations
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSnapshots
                  - ec2:DescribeSpotPriceHistory
                  - ec2:DescribeSubnets
                  - ec2:DescribeVolumes
                Resource: "*"
              - Sid: ReadSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hatchrun/connect/${TenantId}"
              # Instances only through RunInstances, which is also how EC2
              # authorizes each instance a fleet starts, with the launch
              # template version's settings as the condition keys.
              # CreateFleet is never allowed on instances: it would be
              # checked without any of these keys.
              - Sid: LaunchInstances
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/hatchrun:tenant: !Ref TenantId
                    ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
                    ec2:MetadataHttpTokens: required
                  NumericLessThanEquals:
                    ec2:MetadataHttpPutResponseHopLimit: 1
                  StringLike:
                    ec2:InstanceType: !Ref InstanceTypes
              - Sid: RefuseExcludedTypes
                Effect: Deny
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringLike:
                    ec2:InstanceType: !Ref ExcludedInstanceTypes
              - Sid: LaunchVolumes
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  Bool:
                    ec2:Encrypted: "true"
                  NumericLessThanEquals:
                    ec2:VolumeSize: !Ref VolumeSizeLimit
              # The hatchrun runner images come from AWS Marketplace. EC2
              # gives every Marketplace image the owner aws-marketplace in
              # this key, and refuses an image of a product this account
              # has not subscribed to.
              - Sid: LaunchImages
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
                Condition:
                  StringEquals:
                    ec2:Owner: aws-marketplace
              - Sid: LaunchNetwork
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  StringEquals:
                    ec2:Vpc: !Sub
                      - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${Id}"
                      - Id: !If [CreateVpc, !Ref Vpc, !Ref VpcId]
              - Sid: LaunchFromTemplate
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${RunnerSecurityGroup}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
              # Security groups and capacity reservations the owner tags
              # with this tenant, so runners can join more groups in the
              # VPC or use reserved capacity without a stack update.
              - Sid: LaunchTaggedSecurityGroups
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: !Ref TenantId
                    ec2:Vpc: !Sub
                      - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${Id}"
                      - Id: !If [CreateVpc, !Ref Vpc, !Ref VpcId]
              - Sid: LaunchTaggedCapacity
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:capacity-reservation/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: !Ref TenantId
              # Cache volumes start from snapshots hatchrun.io took of
              # this tenant's earlier volumes. LaunchVolumes holds them to
              # the same encryption and size limits as root volumes.
              - Sid: LaunchFromCacheSnapshots
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet, ec2:CreateVolume]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: !Ref TenantId
              # Each launch is an instant EC2 Fleet of one. The fleet is
              # checked on the subnets, template, image, volumes and
              # security group above and on itself; the instance it
              # starts is held to LaunchInstances.
              - Sid: LaunchFleet
                Effect: Allow
                Action: ec2:CreateFleet
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:fleet/*"
              # A fleet takes no user data, root volume or instance tags of
              # its own, so each launch adds a version of this template
              # with them and deletes it after. The default version never
              # changes, and a version that loosens the metadata or
              # volume settings cannot launch: LaunchInstances and
              # LaunchVolumes still refuse it.
              - Sid: RunnerTemplateVersions
                Effect: Allow
                Action:
                  - ec2:CreateLaunchTemplateVersion
                  - ec2:DeleteLaunchTemplateVersions
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
              - Sid: TagAtLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: [RunInstances, CreateVolume, CreateSnapshot]
              - Sid: ManageOwnInstances
                Effect: Allow
                Action:
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  # The boot log of a runner that never registered.
                  - ec2:GetConsoleOutput
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: !Ref TenantId
              # Cache volumes: kept between jobs of one repository and
              # moved from runner to runner, or snapshotted after a job
              # and restored at the next launch. Only volumes and
              # snapshots tagged with this tenant, encrypted and within
              # VolumeSizeLimit.
              - Sid: CreateCacheVolumes
                Effect: Allow
                Action: ec2:CreateVolume
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/hatchrun:tenant: !Ref TenantId
                  Bool:
                    ec2:Encrypted: "true"
                  NumericLessThanEquals:
                    ec2:VolumeSize: !Ref VolumeSizeLimit
              - Sid: ManageCacheVolumes
                Effect: Allow
                Action:
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:DeleteVolume
                  - ec2:CreateSnapshot
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: !Ref TenantId
              - Sid: CreateCacheSnapshots
                Effect: Allow
                Action: ec2:CreateSnapshot
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/hatchrun:tenant: !Ref TenantId
              - Sid: DeleteCacheSnapshots
                Effect: Allow
                Action: ec2:DeleteSnapshot
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: !Ref TenantId
              # hatchrun.io signs the URLs runners use for the cache;
              # listing finds entries by key prefix, as actions/cache
              # restore keys do.
              - Sid: CacheObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${CacheBucket.Arn}/*"
              - Sid: ListCache
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt CacheBucket.Arn
              # Runners get an instance profile only when the owner makes
              # a role under the /hatchrun/ path and picks it for a runner
              # profile; what the role may do is the owner's to decide.
              - Sid: PassRunnerRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hatchrun/*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              # The first Spot launch and the first fleet in an account
              # create these roles.
              - Sid: SpotServiceRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/spot.amazonaws.com/AWSServiceRoleForEC2Spot"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: spot.amazonaws.com
              - Sid: FleetServiceRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ec2fleet.amazonaws.com/AWSServiceRoleForEC2Fleet"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ec2fleet.amazonaws.com

Outputs:
  RoleArn:
    Description: Paste this into the hatchrun.io dashboard.
    Value: !GetAtt ControlPlaneRole.Arn
  OidcProviderArn:
    Description: Pass this to stacks in other regions of this account.
    Value: !If [CreateOidcProvider, !Ref OidcProvider, !Ref OidcProviderArn]
  LaunchTemplateId:
    Value: !Ref LaunchTemplate
  CacheBucket:
    Description: Job caches. Kept when the stack is deleted.
    Value: !Ref CacheBucket
  SubnetIds:
    Value: !If
      - CreateVpc
      - !Join [",", [!Ref SubnetA, !Ref SubnetB]]
      - !Join [",", !Ref SubnetIds]
