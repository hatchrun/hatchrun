AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The hatchrun-owned AWS account that runs hatchrun CI jobs, one EC2
  instance per job. Deploy it once in us-east-1. hatchrun-ci takes the
  RoleArn output as its CI_ROLE_ARN secret and finds the launch template
  by name and the subnets by their hatchrun:tenant tag.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: hatchrun-ci }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: hatchrun-ci }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: hatchrun-ci }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Public subnets in three zones: no NAT gateway to pay for, and the
  # launcher tries the next subnet when a zone has no capacity.
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/18
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: hatchrun-ci-a }
        - { Key: "hatchrun:tenant", Value: hatchrun-ci }

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.64.0/18
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: hatchrun-ci-b }
        - { Key: "hatchrun:tenant", Value: hatchrun-ci }

  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.128.0/18
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: hatchrun-ci-c }
        - { Key: "hatchrun:tenant", Value: hatchrun-ci }

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  SubnetCRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetC
      RouteTableId: !Ref RouteTable

  # No inbound traffic. Outbound port 25 is blocked so a job cannot send
  # mail from our address space. A security group can only allow, and
  # once it lists any egress rule it drops the allow-all default, so the
  # blocked port is the gap between 0-24 and 26-65535. A network ACL
  # would also work but is stateless and applies to the whole subnet,
  # so it needs ephemeral port rules for return traffic; the group
  # follows the instance and keeps connection tracking.
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "hatchrun CI runners: no inbound traffic, no outbound port 25"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 0, ToPort: 24, CidrIp: 0.0.0.0/0, Description: TCP below port 25 }
        - { IpProtocol: tcp, FromPort: 26, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: TCP above port 25 }
        - { IpProtocol: udp, FromPort: 0, ToPort: 65535, CidrIp: 0.0.0.0/0, Description: All UDP }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 0.0.0.0/0, Description: All ICMP }
      Tags:
        - { Key: Name, Value: hatchrun-ci-runners }

  # hatchrun-ci finds the template by this name. The image and instance
  # type come with each launch. Runners get no
  # instance profile. IMDSv2 is required at launch with a hop limit of
  # 1; hatchrun-ci turns the metadata endpoint off before it hands the
  # job its document.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: hatchrun-ci-runner
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - { Key: "hatchrun:tenant", Value: hatchrun-ci }
      LaunchTemplateData:
        SecurityGroupIds: [!Ref RunnerSecurityGroup]
        InstanceInitiatedShutdownBehavior: terminate
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeType: gp3
              VolumeSize: 30
              Encrypted: true
              DeleteOnTermination: true

  # What hatchrun-ci may do here: launch Marketplace images from this
  # template into this VPC and end the instances it tagged. There is no
  # iam:PassRole, so no instance can get a role. hatchrun-ci signs a
  # short-lived token with subject tenant:hatchrun-ci and trades it for
  # the role's credentials through the account's IAM provider for
  # oidc.hatchrun.io. An account has one provider per URL, so the stack
  # uses the existing one: create it first, with audience
  # sts.amazonaws.com, where no connect.yaml stack made it.
  LauncherRole:
    Type: AWS::IAM::Role
    Properties:
      Description: hatchrun-ci launches and removes CI runner instances
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/oidc.hatchrun.io"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.hatchrun.io:aud: sts.amazonaws.com
                oidc.hatchrun.io:sub: tenant:hatchrun-ci
      Policies:
        - PolicyName: run-ci-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # EC2 allows describing only on "*".
              - Sid: List
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeSubnets
                Resource: "*"
              - Sid: LaunchInstances
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/hatchrun:tenant: hatchrun-ci
                    ec2:LaunchTemplate: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
                    ec2:MetadataHttpTokens: required
                  NumericLessThanEquals:
                    ec2:MetadataHttpPutResponseHopLimit: 1
              - Sid: LaunchVolumes
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                Condition:
                  Bool:
                    ec2:Encrypted: "true"
              # Marketplace images, which the account subscribes to.
              - Sid: LaunchImages
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
                Condition:
                  StringEquals:
                    ec2:Owner: aws-marketplace
              - Sid: LaunchNetwork
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  StringEquals:
                    ec2:Vpc: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${Vpc}"
              - Sid: LaunchFromTemplate
                Effect: Allow
                Action: [ec2:RunInstances, ec2:CreateFleet]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${RunnerSecurityGroup}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
              # Each launch is an instant EC2 Fleet of one. The instance
              # it starts is held to LaunchInstances.
              - Sid: LaunchFleet
                Effect: Allow
                Action: ec2:CreateFleet
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:fleet/*"
              # A fleet takes no user data or instance tags of its own,
              # so each launch adds a version of the template with them
              # and deletes it after.
              - Sid: RunnerTemplateVersions
                Effect: Allow
                Action:
                  - ec2:CreateLaunchTemplateVersion
                  - ec2:DeleteLaunchTemplateVersions
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
              - Sid: TagAtLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:spot-instances-request/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: [RunInstances, CreateFleet]
              # Ending a job's instance, turning its metadata off, and
              # starting a pool instance a job took.
              - Sid: ManageOwnInstances
                Effect: Allow
                Action:
                  - ec2:TerminateInstances
                  - ec2:ModifyInstanceMetadataOptions
                  - ec2:StartInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: hatchrun-ci
              # The warm pool: stopping a warmed-up instance and setting
              # the user data of a job's instance, only while the instance
              # still carries its pool tag. A job's instance has none.
              - Sid: ManagePoolInstances
                Effect: Allow
                Action:
                  - ec2:StopInstances
                  - ec2:ModifyInstanceAttribute
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: hatchrun-ci
                  "Null":
                    aws:ResourceTag/hatchrun:pool: "false"
              # A pool instance gets its job's tags while it has its pool
              # tag. The pool tag itself can never be set, so a job's
              # instance cannot become a pool instance. ForAllValues is
              # true for an empty key list, so the keys must exist.
              - Sid: TagPoolInstances
                Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: hatchrun-ci
                  "Null":
                    aws:ResourceTag/hatchrun:pool: "false"
                    aws:TagKeys: "false"
                  ForAllValues:StringEquals:
                    aws:TagKeys:
                      - Name
                      - hatchrun:job-id
                      - hatchrun:runner-name
              # The pool tag is deleted when a job takes the instance, and
              # nothing else is.
              - Sid: UntagPoolInstances
                Effect: Allow
                Action: ec2:DeleteTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hatchrun:tenant: hatchrun-ci
                  "Null":
                    aws:ResourceTag/hatchrun:pool: "false"
                    aws:TagKeys: "false"
                  ForAllValues:StringEquals:
                    aws:TagKeys: hatchrun:pool

Outputs:
  RoleArn:
    Description: The CI_ROLE_ARN secret of hatchrun-ci
    Value: !GetAtt LauncherRole.Arn
