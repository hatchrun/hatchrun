# git-cliff turns Conventional Commits on main into release versions and
# release notes. Only feat, fix, perf and revert commits cut a release;
# docs, ci, build, chore, test, refactor and style commits do not.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}

{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { message = ".*", skip = true },
]

[bump]
# Stay on 0.x: breaking changes bump the minor version until 1.0.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
