[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Gamunu Balagalla <gamunu.balagalla@gmail.com>"]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/hatchrun/hatchrun"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true

# wasm-bindgen reads custom sections that a full strip removes.
[profile.release.package.hatchrun-broker]
strip = "debuginfo"

[profile.release.package.hatchrun-ci]
strip = "debuginfo"

[profile.release.package.hatchrun-cloud]
strip = "debuginfo"

[profile.release.package.hatchrun-telemetry]
strip = "debuginfo"
