[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Gamunu Balagalla <gamunu.balagalla@gmail.com>"]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/hatchrun/hatchrun"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
